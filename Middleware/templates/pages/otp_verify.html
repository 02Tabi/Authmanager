{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two-Factor Authentication — Auth Manager</title>
  <link rel="stylesheet" href="{% static 'css/coreui.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/all.min.css' %}">
</head>

<body class="bg-body-tertiary min-vh-100 d-flex flex-row align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm p-3 mx-4">
          <div class="card-body text-center p-4">
            
            <h2 class="fs-3 fw-bold mb-2">Two-Factor Authentication</h2>
            
            <p class="text-body-secondary small mb-4">
              We've sent a 6-digit verification code to your registered device
              {% if obfuscated_phone %}<strong>({{ obfuscated_phone }})</strong>{% endif %}.
            </p>

            {% if error %}
              <div class="alert alert-danger py-2 small" role="alert">
                {{ error }}
              </div>
            {% endif %}

            <form method="post" action="{% url 'portal_otp_verify' %}">
              {% csrf_token %}
              
              <div class="mb-4">
                <input 
                  class="form-control text-center fs-4 fw-bold mx-auto" 
                  style="max-width: 260px; letter-spacing: 0.5rem;"
                  type="text" 
                  name="otp_code" 
                  placeholder="••••••" 
                  maxlength="6" 
                  required 
                  autofocus 
                  autocomplete="one-time-code"
                  pattern="\d{6}"
                  title="Please enter a valid 6-digit code"
                />
              </div>
              
              <button class="btn btn-primary btn-lg w-100 mb-3" type="submit">
                Verify Code
              </button>
              
              <div class="mt-3">
                <a href="{% url 'portal_login' %}" class="text-decoration-none text-muted small">
                  Cancel and return to Login
                </a>
              </div>
              
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="{% static 'js/coreui.bundle.min.js' %}"></script>
</body>
</html>
